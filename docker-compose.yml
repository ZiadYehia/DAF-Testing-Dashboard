services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: testing-dashboard-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testing-dashboard-app
    ports:
      - "3000:3000"
    environment:
      # Database
      DB_HOST: db
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-TestingDashboard}"
      DB_SYNC: "false"
      DB_ENCRYPT: "false"
      # Jira
      JIRA_BASE_URL: "${JIRA_BASE_URL}"
      JIRA_EMAIL: "${JIRA_EMAIL}"
      JIRA_API_TOKEN: "${JIRA_API_TOKEN}"
      JIRA_PROJECT_KEY: "${JIRA_PROJECT_KEY}"
      JIRA_BOARD_ID: "${JIRA_BOARD_ID}"
      NEXT_PUBLIC_JIRA_URL: "${NEXT_PUBLIC_JIRA_URL}"
      # AI
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      GROQ_API_KEY: "${GROQ_API_KEY}"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqldata:
