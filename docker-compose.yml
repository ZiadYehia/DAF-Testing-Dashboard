services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: testing-dashboard-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./backups:/var/opt/mssql/backups
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  proxy:
    image: caddy:2-alpine
    container_name: testing-dashboard-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # e.g. <your-ip-dashes>.sslip.io — Caddy auto-provisions Let's Encrypt TLS.
      # Unset = plain HTTP on :80.
      DOMAIN: "${DOMAIN:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testing-dashboard-app
    ports:
      # Loopback only — external traffic goes through the proxy (80/443).
      - "127.0.0.1:3000:3000"
    environment:
      # Auth
      SESSION_SECRET: "${SESSION_SECRET}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL}"
      SEED_ADMIN_NAME: "${SEED_ADMIN_NAME}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD}"
      # Database
      DB_HOST: db
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME:-TestingDashboard}"
      DB_SYNC: "false"
      DB_ENCRYPT: "false"
      DB_TRUST_CERT: "${DB_TRUST_CERT:-true}"
      # Jira
      JIRA_BASE_URL: "${JIRA_BASE_URL}"
      JIRA_EMAIL: "${JIRA_EMAIL}"
      JIRA_API_TOKEN: "${JIRA_API_TOKEN}"
      JIRA_PROJECT_KEY: "${JIRA_PROJECT_KEY}"
      JIRA_BOARD_ID: "${JIRA_BOARD_ID}"
      NEXT_PUBLIC_JIRA_URL: "${NEXT_PUBLIC_JIRA_URL}"
      # AI
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      GROQ_API_KEY: "${GROQ_API_KEY}"
    volumes:
      - ./data:/app/data
      # Automation Hub projects, specs, run artifacts, and its gitignored .env
      # (target-app base URLs + credentials) — replay reads/writes here.
      - ./automation-hub:/app/automation-hub
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqldata:
  caddydata:
