[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --alluredir=reports/allure-results
markers =
    smoke: Quick validation tests
    regression: Full regression tests
    e2e: End-to-end tests
    ui: UI tests
    slow: Tests that take a long time
    known-bug: Fails until a tracked defect is fixed
    testcase-mismatch: Testcase disagrees with current app behavior by design
